stages:
  - test
  - deploy

# Run merge-request pipelines, and branch pipelines only when no MR is open for
# the branch (avoids duplicate branch + MR pipelines once MR-gated jobs exist).
workflow:
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH && $CI_OPEN_MERGE_REQUESTS
      when: never
    - if: $CI_COMMIT_BRANCH

### Tests ###

# The run planner (pgs_recon/stages.py) is pure logic over the manifest and the
# parsed arguments: stdlib only, no filesystem, no binaries. So this needs
# nothing but a Python interpreter and is the fastest signal in the pipeline.
# tests/test_reconstruct.py skips itself here, since configargparse and
# sfm_utils are not installed; test:python below runs it with them present.
test:unit:
  stage: test
  image: python:3.9-slim
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH
  script:
    - python -m unittest discover -s tests -v

# Quick check for normal MRs: install the Python package (and its Python deps)
# into a venv and smoke-test the entry point. The compiled OpenMVG/OpenMVS
# binaries are discovered at runtime, not at install time, so this needs no C++
# build. Runs on every pipeline for fast feedback.
test:python:
  stage: test
  image: ubuntu:22.04
  variables:
    DEBIAN_FRONTEND: "noninteractive"
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH
  before_script:
    - apt update
    - apt install -y --no-install-recommends build-essential python3-dev python3-pip python3-venv git
  script:
    - echo Installing Python package
    - python3 -m venv venv
    - source venv/bin/activate
    - python -m pip install --upgrade pip setuptools wheel
    - python -m pip install .
    - pgs-recon --help
    - echo Running the test suite against the installed dependencies
    - python -m unittest discover -s tests -v

# The only job that runs the suite where the binaries are. Both jobs above run
# against a /usr/local with no OpenMVG in it, so anything reaching the built-in
# default prefix passes for the wrong reason -- three tests did, asserting
# ToolNotFound for real tool names and failing inside the image while CI stayed
# green. The repo checkout shadows the image's editable install, so this tests the
# MR's code against the real toolchain.
#
# It is also the only place test_openmvs.TestSurfaceMatchesTheInstalledBinaries
# runs: OpenMVS is fetched as a tarball with no source tree to transcribe from, so
# the binaries' own --help is the authority that ADR 0005's "every flag reachable"
# is checked against, and that check skips itself wherever they are missing.
test:in-image:
  stage: test
  image: ghcr.io/educelab/pgs-recon:edge
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH
  script:
    # Assert the layout this job exists for, so a moved prefix fails here rather
    # than quietly making the job meaningless again.
    - test -x /usr/local/bin/openMVG_main_SfM
    - test -x /usr/local/bin/OpenMVS/ReconstructMesh
    - python -m unittest discover -s tests -v

# Full C++ dependency build across the same base-image / CUDA matrix as the
# GitHub Docker images. Expensive, so gated to MRs that actually touch the
# dependencies, Dockerfile, or CI config. CUDA variants compile the .cu kernels
# with nvcc (no GPU needed), catching CUDA-only regressions on the MR instead of
# in the downstream image build.
.build:
  stage: test
  image: $BASE_IMAGE
  variables:
    PACKAGE_LIST: ci/apt-ubuntu-jammy
    PYTHON_EXE: "python3"
    USE_CUDA: "OFF"
    CUDA_ARCHITECTURES: "60;61;70;90"
    DEBIAN_FRONTEND: "noninteractive"
  before_script:
    - apt update
    - apt install -y --no-install-recommends $(cat $PACKAGE_LIST)
  script:
    - echo "Building dependencies (BASE_IMAGE=$BASE_IMAGE USE_CUDA=$USE_CUDA)"
    - if [ "$USE_CUDA" = "ON" ]; then export CUDACXX="/usr/local/cuda/bin/nvcc"; fi
    - mkdir -p dependencies/build/
    - cmake -GNinja -S dependencies/ -B dependencies/build/
        -DCMAKE_BUILD_TYPE=Release
        -DBUILD_JPEG=OFF
        -DBUILD_CERES=ON
        -DUSE_CUDA=$USE_CUDA
        -DCMAKE_CUDA_ARCHITECTURES="$CUDA_ARCHITECTURES"
    - cmake --build dependencies/build/
    - ${PYTHON_EXE} -m venv venv
    - source venv/bin/activate
    - python -m pip install .

test:dependencies:
  extends: .build
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
      changes:
        - dependencies/**/*
        - Dockerfile
        - ci/**/*
        - .gitlab-ci.yml
  parallel:
    matrix:
      - BASE_IMAGE: "ubuntu:22.04"
        USE_CUDA: "OFF"
      - BASE_IMAGE: "ubuntu:24.04"
        USE_CUDA: "OFF"
      - BASE_IMAGE: "nvidia/cuda:12.4.1-devel-ubuntu22.04"
        USE_CUDA: "ON"
      - BASE_IMAGE: "nvidia/cuda:12.8.1-devel-ubuntu22.04"
        USE_CUDA: "ON"